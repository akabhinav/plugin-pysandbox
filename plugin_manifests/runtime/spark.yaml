id: spark
version: "1.0.0"
display_name: "Apache Spark Cluster"
description: "Apache Spark standalone cluster (master + workers) with Iceberg, Nessie, and S3 support"
category: runtime
tags: [runtime, spark, iceberg, lakehouse, processing, analytics, cluster]
docker_image: "apache/spark:{version}"
supported_versions: ["latest", "3.5.4", "3.5.3", "3.4.4"]
default_version: "3.5.4"
ports:
  - port: 8080
    protocol: tcp
    name: master-ui
  - port: 7077
    protocol: tcp
    name: master
  - port: 4040
    protocol: tcp
    name: spark-ui
  - port: 8081
    protocol: tcp
    name: worker-ui
resources:
  cpu: "1.0"
  memory: "2048m"
  disk_gb: 10.0
health_check:
  type: http
  port: 8080
  path: "/"
  interval_seconds: 10
  timeout_seconds: 10
  retries: 30
config_params:
  - key: workers
    type: int
    default: 2
    required: false
    description: "Number of Spark workers"
  - key: worker_cores
    type: int
    default: 2
    required: false
    description: "CPU cores per worker"
  - key: worker_memory
    type: string
    default: "1g"
    required: false
    description: "Memory per worker (e.g. 1g, 2g)"
depends_on: []
startup_order: 70
generates_credentials: false
persistent_data: false
supports_hot_reload: false
