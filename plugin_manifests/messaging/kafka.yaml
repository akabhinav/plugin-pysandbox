id: kafka
version: "1.0.0"
display_name: "Apache Kafka"
description: "Apache Kafka distributed event streaming platform"
category: messaging
tags: [messaging, streaming, event, kafka]
docker_image: "apache/kafka:{version}"
supported_versions: ["latest", "3.9.0", "3.8.1", "3.7.0"]
default_version: "latest"
ports:
  - port: 9092
    protocol: tcp
    name: plaintext
  - port: 9093
    protocol: tcp
    name: controller
resources:
  cpu: "1.0"
  memory: "1024m"
  disk_gb: 5.0
health_check:
  type: tcp
  port: 9092
  interval_seconds: 10
  timeout_seconds: 10
  retries: 24
config_params: []
depends_on: []
startup_order: 60
generates_credentials: false
persistent_data: true
supports_hot_reload: false
