id: kafka
version: "1.0.0"
display_name: "Confluent Kafka"
description: "Confluent Local Kafka - single-node KRaft mode for development"
category: messaging
tags: [messaging, streaming, event, kafka, confluent]
docker_image: "confluentinc/confluent-local:{version}"
supported_versions: ["latest", "7.9.0", "7.8.0", "7.7.0"]
default_version: "latest"
ports:
  - port: 9092
    protocol: tcp
    name: plaintext
  - port: 9093
    protocol: tcp
    name: controller
resources:
  cpu: "1.0"
  memory: "1024m"
  disk_gb: 5.0
health_check:
  type: tcp
  port: 9092
  interval_seconds: 5
  timeout_seconds: 10
  retries: 40
config_params: []
depends_on: []
startup_order: 60
generates_credentials: false
persistent_data: true
supports_hot_reload: false
