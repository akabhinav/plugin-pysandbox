id: nats
version: "1.0.0"
display_name: "NATS"
description: "NATS high-performance messaging system"
category: messaging
tags: [messaging, pubsub, nats]
docker_image: "nats:{version}-alpine"
supported_versions: ["latest", "2.10", "2.9"]
default_version: "latest"
ports:
  - port: 4222
    protocol: tcp
    name: client
  - port: 8222
    protocol: tcp
    name: monitoring
resources:
  cpu: "0.25"
  memory: "256m"
  disk_gb: 1.0
health_check:
  type: http
  port: 8222
  path: "/healthz"
  interval_seconds: 5
  timeout_seconds: 3
  retries: 10
config_params: []
depends_on: []
startup_order: 60
generates_credentials: false
persistent_data: false
supports_hot_reload: false
