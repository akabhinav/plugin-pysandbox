id: minio
version: "1.0.0"
display_name: "MinIO"
description: "MinIO S3-compatible object storage"
category: cloud
tags: [cloud, storage, s3, minio]
docker_image: "minio/minio:{version}"
supported_versions: ["latest", "RELEASE.2024-01-31T20-20-33Z"]
default_version: "latest"
ports:
  - port: 9000
    protocol: tcp
    name: api
  - port: 9001
    protocol: tcp
    name: console
resources:
  cpu: "0.5"
  memory: "512m"
  disk_gb: 5.0
health_check:
  type: http
  port: 9000
  path: "/minio/health/live"
  interval_seconds: 5
  timeout_seconds: 3
  retries: 10
config_params: []
depends_on: []
startup_order: 50
generates_credentials: true
persistent_data: true
supports_hot_reload: false
