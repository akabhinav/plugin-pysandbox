id: localstack
version: "1.0.0"
display_name: "LocalStack"
description: "LocalStack local AWS cloud emulator"
category: cloud
tags: [cloud, aws, emulator, localstack]
docker_image: "localstack/localstack:{version}"
supported_versions: ["1.4.0", "1.3", "1.2", "1.1"]
default_version: "1.4.0"
ports:
  - port: 4566
    protocol: tcp
    name: primary
resources:
  cpu: "1.0"
  memory: "1024m"
  disk_gb: 5.0
health_check:
  type: http
  port: 4566
  path: "/_localstack/health"
  interval_seconds: 10
  timeout_seconds: 10
  retries: 30
config_params: []
depends_on: []
startup_order: 50
generates_credentials: true
persistent_data: false
supports_hot_reload: false
