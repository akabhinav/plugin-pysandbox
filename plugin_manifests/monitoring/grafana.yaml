id: grafana
version: "1.0.0"
display_name: "Grafana"
description: "Grafana observability and data visualization platform"
category: monitoring
tags: [monitoring, visualization, dashboards, grafana]
docker_image: "grafana/grafana:{version}"
supported_versions: ["latest", "10.3.0", "10.2.0", "10.1.0"]
default_version: "latest"
ports:
  - port: 3000
    protocol: tcp
    name: primary
resources:
  cpu: "0.5"
  memory: "512m"
  disk_gb: 2.0
health_check:
  type: http
  port: 3000
  path: "/api/health"
  interval_seconds: 5
  timeout_seconds: 3
  retries: 10
config_params: []
depends_on: []
startup_order: 70
generates_credentials: true
persistent_data: true
supports_hot_reload: false
