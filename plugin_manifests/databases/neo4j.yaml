id: neo4j
version: "1.0.0"
display_name: "Neo4j"
description: "Neo4j graph database"
category: databases
tags: [database, graph, nosql, neo4j]
docker_image: "neo4j:{version}"
supported_versions: ["latest", "5", "4.4"]
default_version: "latest"
ports:
  - port: 7474
    protocol: tcp
    name: http
  - port: 7687
    protocol: tcp
    name: bolt
resources:
  cpu: "0.5"
  memory: "1024m"
  disk_gb: 2.0
health_check:
  type: http
  port: 7474
  path: "/"
  interval_seconds: 5
  timeout_seconds: 10
  retries: 30
config_params: []
depends_on: []
startup_order: 50
generates_credentials: true
persistent_data: true
supports_hot_reload: false
