id: mongodb
version: "1.0.0"
display_name: "MongoDB"
description: "MongoDB document database"
category: databases
tags: [database, nosql, document, mongodb]
docker_image: "mongo:{version}"
supported_versions: ["latest", "7", "6", "5"]
default_version: "latest"
ports:
  - port: 27017
    protocol: tcp
    name: primary
resources:
  cpu: "0.5"
  memory: "512m"
  disk_gb: 2.0
health_check:
  type: tcp
  port: 27017
  interval_seconds: 5
  timeout_seconds: 3
  retries: 10
config_params: []
depends_on: []
startup_order: 50
generates_credentials: true
persistent_data: true
supports_hot_reload: false
