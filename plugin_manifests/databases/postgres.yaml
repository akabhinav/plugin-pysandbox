id: postgres
version: "1.0.0"
display_name: "PostgreSQL"
description: "PostgreSQL relational database server"
category: databases
tags: [database, sql, relational, postgres]
docker_image: "postgres:{version}"
supported_versions: ["latest", "16", "15", "14", "13"]
default_version: "latest"
ports:
  - port: 5432
    protocol: tcp
    name: primary
resources:
  cpu: "0.5"
  memory: "512m"
  disk_gb: 2.0
health_check:
  type: tcp
  port: 5432
  interval_seconds: 5
  timeout_seconds: 3
  retries: 10
config_params: []
depends_on: []
startup_order: 50
generates_credentials: true
persistent_data: true
supports_hot_reload: false
