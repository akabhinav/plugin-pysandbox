id: clickhouse
version: "1.0.0"
display_name: "ClickHouse"
description: "ClickHouse column-oriented analytics database"
category: databases
tags: [database, analytics, columnar, clickhouse]
docker_image: "clickhouse/clickhouse-server:{version}"
supported_versions: ["latest", "24.1", "23.12", "23.8"]
default_version: "latest"
ports:
  - port: 8123
    protocol: tcp
    name: http
  - port: 9000
    protocol: tcp
    name: native
resources:
  cpu: "1.0"
  memory: "1024m"
  disk_gb: 5.0
health_check:
  type: http
  port: 8123
  path: "/ping"
  interval_seconds: 5
  timeout_seconds: 3
  retries: 10
config_params: []
depends_on: []
startup_order: 50
generates_credentials: true
persistent_data: true
supports_hot_reload: false
