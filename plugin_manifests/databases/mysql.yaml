id: mysql
version: "1.0.0"
display_name: "MySQL"
description: "MySQL relational database server"
category: databases
tags: [database, sql, relational, mysql]
docker_image: "mysql:{version}"
supported_versions: ["latest", "8.0", "5.7"]
default_version: "latest"
ports:
  - port: 3306
    protocol: tcp
    name: primary
resources:
  cpu: "0.5"
  memory: "512m"
  disk_gb: 2.0
health_check:
  type: tcp
  port: 3306
  interval_seconds: 5
  timeout_seconds: 3
  retries: 10
config_params: []
depends_on: []
startup_order: 50
generates_credentials: true
persistent_data: true
supports_hot_reload: false
