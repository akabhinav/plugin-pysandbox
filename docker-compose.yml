version: "3.9"

services:
  pysandbox-api:
    build: .
    ports: ["8080:8080"]
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./plugin_manifests:/app/plugin_manifests:ro
    depends_on: [postgres-platform, redis-platform]

  postgres-platform:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pysandbox
      POSTGRES_USER: pysandbox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pysandbox-dev}
    volumes: [pgdata:/var/lib/postgresql/data]

  redis-platform:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-pysandbox-dev}

  prometheus:
    image: prom/prometheus:latest
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]

volumes:
  pgdata:
