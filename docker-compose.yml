services:
  # ── PySandbox API (FastAPI backend) ──────────────────────────────────────
  pysandbox-api:
    build: .
    container_name: pysandbox-api
    ports:
      - "18080:18080"
    volumes:
      # Docker socket — required so pysandbox can manage sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount manifests for live editing (optional — baked into image too)
      - ./plugin_manifests:/app/plugin_manifests:ro
    environment:
      - PYSANDBOX_ENV=dev
      - LOG_LEVEL=INFO
      - HOST_PORT_RANGE_START=20000
      - HOST_PORT_RANGE_END=29999
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── PySandbox UI (Streamlit dashboard) ───────────────────────────────────
  pysandbox-ui:
    build: ./ui
    container_name: pysandbox-ui
    ports:
      - "18501:8501"
    environment:
      - API_BASE=http://pysandbox-api:18080
    depends_on:
      pysandbox-api:
        condition: service_healthy
    restart: unless-stopped
